# Optional second engine for the convergence loop.
#
# The primary driver is a pair of scheduled Cowork tasks (see docs/SCHEDULED-TASK.md),
# which need no API key. This workflow does the same thing inside GitHub Actions and is
# useful if you'd rather the loop run independently of any Claude session.
#
# To enable: add an ANTHROPIC_API_KEY repository secret, then remove the `if: false`
# guard on the job below.

name: trip convergence cycle

on:
  schedule:
    - cron: "0 5 * * *"    # 08:00 Israel (UTC+3) — morning cycle
    - cron: "0 17 * * *"   # 20:00 Israel (UTC+3) — evening cycle
  workflow_dispatch:
    inputs:
      mode:
        description: "cycle mode"
        required: true
        default: morning
        type: choice
        options: [morning, evening]

permissions:
  contents: write

jobs:
  cycle:
    if: false  # ← remove once ANTHROPIC_API_KEY is set
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code

      - name: Pick mode
        id: mode
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "mode=${{ inputs.mode }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event.schedule }}" = "0 5 * * *" ]; then
            echo "mode=morning" >> "$GITHUB_OUTPUT"
          else
            echo "mode=evening" >> "$GITHUB_OUTPUT"
          fi

      - name: Run cycle
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          git config user.name  "trip-fleet"
          git config user.email "actions@github.com"
          bin/run-cycle.sh "${{ steps.mode.outputs.mode }}"

      - name: Push
        run: git push origin HEAD:${{ github.ref_name }} || echo "nothing to push"

      - name: Summary
        if: always()
        run: |
          {
            echo "## Cycle: ${{ steps.mode.outputs.mode }}"
            echo '```'
            python3 bin/convergence.py status
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
